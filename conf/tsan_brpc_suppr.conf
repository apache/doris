# Opt-in for Doris-focused TSan runs.
# Set TSAN_OPTIONS=suppressions=/absolute/path/to/tsan_brpc_suppr.conf.
# A matching access can suppress a report even when the other access is
# in Doris. Prefer top-frame matches to keep reports from Doris callers.
race_top:*/src/brpc/*
race_top:*/src/bthread/*
race_top:*/src/butil/*
race_top:*/src/bvar/*
race_top:*/include/brpc/*
race_top:*/include/bthread/*
race_top:*/include/butil/*
race_top:*/include/bvar/*
race_top:^brpc::
race_top:^bthread::
race_top:^butil::
race_top:^bvar::

# STL vector operations can be the top frame of the resource pool race.
race:butil::ResourcePool<bthread::TimerThread::Task>::push_free_chunk
