# Log4j2 configuration for the hadoop that C++ libhdfs uses.
#
# WHO READS THIS. Only the hadoop drop in lib/hadoop_hdfs, which is on BE's system class path and
# binds Log4j2. bin/start_be.sh names this file with -Dlog4j2.configurationFile when it exists.
#
# WHO DOES NOT. The Java plugins. They no longer share a class path, so no single properties file
# can configure them; each plugin's logging is funnelled into java.util.logging by JniLogging and
# lands in log/jni.log.0. Turning up a level here has no effect on a JNI scanner.
#
# WITHOUT THIS FILE Log4j2 uses its DefaultConfiguration - ERROR only, to the console - so every
# INFO and WARN the native HDFS reader produces is lost and the rest goes to be.out, mixed in with
# the JVM's own crash output. That is exactly the output wanted when diagnosing an HDFS problem.

name = DorisHadoopLibhdfs
status = warn

# ${sys:doris.log.dir} is set by bin/start_be.sh alongside this option; the literal fallback keeps
# a hand-started BE working.
property.logDir = ${sys:doris.log.dir:-log}

appender.hadoop.type = RollingFile
appender.hadoop.name = HadoopFile
appender.hadoop.fileName = ${logDir}/hadoop.log
appender.hadoop.filePattern = ${logDir}/hadoop.log.%i
appender.hadoop.layout.type = PatternLayout
appender.hadoop.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %p [%t] %c{1} - %m%n
appender.hadoop.policies.type = Policies
appender.hadoop.policies.size.type = SizeBasedTriggeringPolicy
appender.hadoop.policies.size.size = 100MB
appender.hadoop.strategy.type = DefaultRolloverStrategy
appender.hadoop.strategy.max = 10

# INFO, matching what the deleted java-common configuration gave these same classes. hadoop is
# noisy below that and its DEBUG is rarely the answer; raise it here when it is.
rootLogger.level = info
rootLogger.appenderRef.hadoop.ref = HadoopFile
