# The authorization plugin API version this FE serves, filtered from
# <authorization.plugin.api.version> in fe/fe-authorization/pom.xml at build time.
#
# A plugin loaded from plugins/authorization/ must declare the same MAJOR in its jar MANIFEST, under
# Doris-Authorization-Plugin-Api-Version. Do not edit this file: it is generated, and the property in the
# pom is the single place the number is written.
api.version=${authorization.plugin.api.version}
