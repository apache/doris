name: Assign Reviewer Candidates

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

# Keep every pending label event and serialize access to the dedicated auth session.
# A new labeled event has a new run ID, even when reviewers-assigned already exists.
concurrency:
  group: reviewer-assignment-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  select:
    if: github.event.label.name == 'need-reviewers' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      # pull_request_target defaults to trusted base code. Never check out the PR head.
      - name: Checkout trusted routing tools
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            tools/reviewer-routing

      - name: Check the assignment helper
        timeout-minutes: 1
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s .github/scripts -p test_reviewer_assignment.py

      - name: Prepare authoritative PR data
        id: prepare
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assignment_workspace="$RUNNER_TEMP/reviewer-assignment-workspace"
          python3 .github/scripts/reviewer_assignment.py prepare --workspace "$assignment_workspace"
          echo "ASSIGNMENT_WORKSPACE=$assignment_workspace" >> "$GITHUB_ENV"

      - name: Install ossutil
        if: steps.prepare.outputs.reuse_selection != 'true'
        timeout-minutes: 3
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          trap 'rm -rf "$package_dir"' EXIT
          curl -fsSL -o "$package_dir/ossutil.zip" https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          unzip -q "$package_dir/ossutil.zip" -d "$package_dir"
          sudo install -m 0755 "$package_dir/ossutil-v1.7.19-linux-amd64/ossutil" /usr/local/bin/ossutil

      - name: Install the pinned Codex package
        if: steps.prepare.outputs.reuse_selection != 'true'
        timeout-minutes: 4
        env:
          OSS_AK: ${{ secrets.OSS_AK }}
          OSS_SK: ${{ secrets.OSS_SK }}
          OSS_ENDPOINT: oss-cn-hongkong.aliyuncs.com
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/codex-exec-goal.tar.gz"
          package="$RUNNER_TEMP/codex-exec-goal"
          ossutil -i "$OSS_AK" -k "$OSS_SK" -e "$OSS_ENDPOINT" cp -f \
            oss://doris-community-ci/codex/releases/codex-exec-goal-0.166.0-217b6e00e031-x86_64-unknown-linux-gnu.tar.gz "$archive"
          echo "19fe4ad3224b4c1bfb90952fd2054b63029bb9ffab6b9e8db3269039193f071c  $archive" | sha256sum --check
          mkdir -p "$package"
          tar -xzf "$archive" -C "$package"
          (cd "$package" && sha256sum --check SHA256SUMS)
          test "$(jq -r .version "$package/codex-package.json")" = 0.166.0
          echo "9346ee98398cb7240702e45eed4cbe38c7fb990d9e031dba4e7525383c415deb  $package/bin/codex" | sha256sum --check
          "$package/bin/codex" exec --help | grep -q -- '--output-schema'
          echo "CODEX_ASSIGNMENT_BIN=$package/bin/codex" >> "$GITHUB_ENV"
          echo "$package/codex-path" >> "$GITHUB_PATH"

      - name: Load the dedicated Codex auth session
        id: auth
        if: steps.prepare.outputs.reuse_selection != 'true'
        timeout-minutes: 3
        env:
          OSS_AK: ${{ secrets.OSS_AK }}
          OSS_SK: ${{ secrets.OSS_SK }}
          OSS_ENDPOINT: oss-cn-hongkong.aliyuncs.com
          AUTH_OBJECT: ${{ vars.REVIEWER_ASSIGNMENT_CODEX_AUTH_OBJECT || 'oss://doris-community-ci/codex/reviewer-assignment/auth.json' }}
        run: |
          set -euo pipefail
          umask 077
          auth_dir="$RUNNER_TEMP/reviewer-assignment-codex"
          install -m 700 -d "$auth_dir"
          ossutil -i "$OSS_AK" -k "$OSS_SK" -e "$OSS_ENDPOINT" \
            cp -f "$AUTH_OBJECT" "$auth_dir/auth.json" >/dev/null
          jq -e '.auth_mode == "chatgpt"
            and (.tokens.access_token | type == "string" and length > 0)
            and (.tokens.refresh_token | type == "string" and length > 0)' \
            "$auth_dir/auth.json" >/dev/null
          while IFS= read -r token_value; do
            echo "::add-mask::$token_value"
          done < <(jq -r '.tokens | .access_token, .refresh_token, (.id_token // empty)' "$auth_dir/auth.json")
          sha256sum "$auth_dir/auth.json" | awk '{print $1}' > "$RUNNER_TEMP/reviewer-assignment-auth.sha256"
          cat > "$auth_dir/config.toml" <<'EOF'
          cli_auth_credentials_store = "file"
          approval_policy = "never"
          [shell_environment_policy]
          inherit = "none"
          EOF
          echo "CODEX_HOME=$auth_dir" >> "$GITHUB_ENV"

      - name: Enable the read-only Codex sandbox on Ubuntu
        if: steps.prepare.outputs.reuse_selection != 'true'
        timeout-minutes: 4
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --unshare-user --ro-bind / / -- /usr/bin/true

      - name: Ask Codex to select at most two reviewers
        if: steps.prepare.outputs.reuse_selection != 'true'
        timeout-minutes: 9
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=20s 480s \
            env -u GH_TOKEN -u GITHUB_TOKEN -u OSS_AK -u OSS_SK \
              -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              PYTHONDONTWRITEBYTECODE=1 \
              "$CODEX_ASSIGNMENT_BIN" exec --skip-git-repo-check --json \
              --cd "$ASSIGNMENT_WORKSPACE" --sandbox read-only --color never \
              --model gpt-6.1-sol --config 'model_reasoning_effort="medium"' \
              --output-schema "$ASSIGNMENT_WORKSPACE/schema.json" \
              --output-last-message "$ASSIGNMENT_WORKSPACE/selection.json" \
              - < "$ASSIGNMENT_WORKSPACE/prompt.txt" \
              > "$RUNNER_TEMP/reviewer-assignment-codex.jsonl" \
              2> "$RUNNER_TEMP/reviewer-assignment-codex.stderr"
          codex_status=$?
          set -e
          if [ "$codex_status" -ne 0 ]; then
            echo "::error::Codex reviewer selection failed with exit status $codex_status. No GitHub writes were attempted."
            jq -r 'select(.type == "turn.failed" or .type == "error") |
              .error.message // .message // empty' \
              "$RUNNER_TEMP/reviewer-assignment-codex.jsonl" | tail -n 2 || true
            exit "$codex_status"
          fi

      - name: Sync refreshed Codex auth
        if: always() && steps.auth.outcome == 'success'
        timeout-minutes: 3
        env:
          OSS_AK: ${{ secrets.OSS_AK }}
          OSS_SK: ${{ secrets.OSS_SK }}
          OSS_ENDPOINT: oss-cn-hongkong.aliyuncs.com
          AUTH_OBJECT: ${{ vars.REVIEWER_ASSIGNMENT_CODEX_AUTH_OBJECT || 'oss://doris-community-ci/codex/reviewer-assignment/auth.json' }}
        run: |
          set -euo pipefail
          umask 077
          jq -e '.auth_mode == "chatgpt"
            and (.tokens.access_token | type == "string" and length > 0)
            and (.tokens.refresh_token | type == "string" and length > 0)' \
            "$CODEX_HOME/auth.json" >/dev/null
          original_hash="$(cat "$RUNNER_TEMP/reviewer-assignment-auth.sha256")"
          local_hash="$(sha256sum "$CODEX_HOME/auth.json" | awk '{print $1}')"
          if [ "$local_hash" = "$original_hash" ]; then
            exit 0
          fi
          current_auth="$(mktemp "$RUNNER_TEMP/reviewer-assignment-current.XXXXXX")"
          trap 'rm -f "$current_auth"' EXIT
          ossutil -i "$OSS_AK" -k "$OSS_SK" -e "$OSS_ENDPOINT" \
            cp -f "$AUTH_OBJECT" "$current_auth" >/dev/null
          remote_hash="$(sha256sum "$current_auth" | awk '{print $1}')"
          if [ "$remote_hash" != "$original_hash" ]; then
            echo "::error::The remote auth session changed concurrently; refusing to overwrite it."
            exit 1
          fi
          ossutil -i "$OSS_AK" -k "$OSS_SK" -e "$OSS_ENDPOINT" \
            cp -f "$CODEX_HOME/auth.json" "$AUTH_OBJECT" >/dev/null

      - name: Validate the selected IDs
        timeout-minutes: 1
        run: |
          python3 .github/scripts/reviewer_assignment.py validate --workspace "$ASSIGNMENT_WORKSPACE"

      - name: Publish the validated assignment plan
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-assignment-plan
          path: |
            ${{ runner.temp }}/reviewer-assignment-workspace/context.json
            ${{ runner.temp }}/reviewer-assignment-workspace/selection.json
          if-no-files-found: error
          retention-days: 7

  assign:
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout trusted assignment helper
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            tools/reviewer-routing

      - name: Download the validated assignment plan
        timeout-minutes: 2
        uses: actions/download-artifact@v4
        with:
          name: reviewer-assignment-plan
          path: ${{ runner.temp }}/reviewer-assignment-plan

      - name: Add assignees, post mentions and finalize labels
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/reviewer_assignment.py apply \
            --workspace "$RUNNER_TEMP/reviewer-assignment-plan"
