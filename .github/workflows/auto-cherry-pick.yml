name: Auto Cherry-Pick to Branch

on:
  pull_request_target:
    types:
      - closed
      - labeled
    branches:
      - master
permissions:
  actions: write
  checks: write
  contents: write
  pull-requests: write
jobs:
  auto_cherry_pick:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.pull_request.merged == true &&
          (contains(github.event.pull_request.labels.*.name, 'dev/4.1.x') ||
           contains(github.event.pull_request.labels.*.name, 'dev/4.2.x')) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install PyGithub
      - name: Check SHA
        id: check_sha
        run: |
            expected_sha="528eabe0941e95bba64751e85dfd6c1539edad7cdf5753267d5f9d991b2359d065dfc76bcb8a69e904f25cb07e16dbc620d01f3a4f40d006f106ff34553d75aa"
            calculated_sha=$(sha512sum tools/auto-pick-script.py | awk '{ print $1 }')
            if [ "$calculated_sha" != "$expected_sha" ]; then
              echo "SHA mismatch! Expected: $expected_sha, but got: $calculated_sha"
              exit 1
            else
              echo "SHA matches: $calculated_sha"
            fi    

      - name: Auto cherry-pick to branch-4.1
        # Match the opening JSON quote so p0_ must start a label name.
        if: >-
          ${{ contains(github.event.pull_request.labels.*.name, 'dev/4.1.x') &&
              (contains(github.event.pull_request.labels.*.name, 'usercase') ||
               contains(toJSON(github.event.pull_request.labels.*.name), '"p0_')) &&
              (github.event.action == 'closed' ||
               (github.event.action == 'labeled' &&
                (github.event.label.name == 'dev/4.1.x' ||
                 github.event.label.name == 'usercase' ||
                 startsWith(github.event.label.name, 'p0_')))) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          CONFLICT_LABEL: dev/4.1.x-conflict
        run: |
          python tools/auto-pick-script.py ${{ github.event.pull_request.number }} branch-4.1

      - name: Auto cherry-pick to branch-4.2
        id: auto_pick_42
        if: >-
          ${{ !cancelled() && steps.check_sha.outcome == 'success' &&
              contains(github.event.pull_request.labels.*.name, 'dev/4.2.x') &&
              (github.event.action == 'closed' ||
               (github.event.action == 'labeled' && github.event.label.name == 'dev/4.2.x')) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          CONFLICT_LABEL: dev/4.2.x-conflict
        run: |
          python tools/auto-pick-script.py ${{ github.event.pull_request.number }} branch-4.2

      - name: Run buildall for the branch-4.2 PR
        if: ${{ !cancelled() && steps.auto_pick_42.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_PICK_PR_NUMBER: ${{ steps.auto_pick_42.outputs.pr_number }}
          AUTO_PICK_HEAD_SHA: ${{ steps.auto_pick_42.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/comment-to-trigger-teamcity.yml/dispatches" \
            -f ref=master -f "inputs[pr_number]=${AUTO_PICK_PR_NUMBER}" \
            -f "inputs[head_sha]=${AUTO_PICK_HEAD_SHA}"
