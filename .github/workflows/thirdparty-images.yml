---
name: Thirdparty image configuration

on:
  pull_request:
    paths:
      - 'docker/thirdparties/**'
      - '.github/workflows/thirdparty-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thirdparty-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check tools
        run: |
          docker compose version
          command -v envsubst
      - name: Check shell syntax
        working-directory: docker/thirdparties
        run: |
          for script in custom_settings.env image-catalog.env image-registry.sh \
            docker-command.sh run-thirdparties-docker.sh \
            docker-compose/hive/scripts/snapshot-hive-baseline.sh test/*.sh; do
            bash -n "$script"
          done
      - name: Test image configuration and existing launcher contracts
        working-directory: docker/thirdparties
        run: |
          python3 test/test_image_registry.py
          bash test/docker-command-test.sh
          bash test/launcher-stop-test.sh
          bash test/run-thirdparties-docker-hive-bootstrap-groups-test.sh
          bash test/fluss-network-test.sh
          bash test/juicefs-helpers-mirror-test.sh
