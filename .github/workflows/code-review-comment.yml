name: Code Review Comment Dispatch

on:
  issue_comment:
    types: [created]

permissions:
  statuses: write
  pull-requests: write
  contents: read
  issues: write

jobs:
  resolve-pr:
    runs-on: ubuntu-latest
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      (
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      review_focus: ${{ steps.pr.outputs.review_focus }}
    steps:
      - name: Get PR info
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          PR_JSON=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }})
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.head.sha')
          BASE_SHA=$(echo "$PR_JSON" | jq -r '.base.sha')
          REVIEW_FOCUS=$(printf '%s' "${COMMENT_BODY#'/review'}" | sed 's/^[[:space:]]*//')

          echo "pr_number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "review_focus<<EOF"
            printf '%s\n' "$REVIEW_FOCUS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  code-review:
    needs:
      - resolve-pr
      - mark-review-pending
      - enqueue-review
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      (
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    uses: ./.github/workflows/code-review-runner.yml
    secrets: inherit
    with:
      pr_number: ${{ needs.resolve-pr.outputs.pr_number }}
      head_sha: ${{ needs.resolve-pr.outputs.head_sha }}
      base_sha: ${{ needs.resolve-pr.outputs.base_sha }}
      review_focus: ${{ needs.resolve-pr.outputs.review_focus }}
      deferred_request_id: ${{ github.run_id }}
      deferred_claim_id: ${{ github.run_id }}

  enqueue-review:
    needs: resolve-pr
    runs-on: ubuntu-latest
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      (
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    steps:
      - name: Install ossutil
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          curl -fsSL -o "$tmp_dir/ossutil.zip" https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          unzip -q "$tmp_dir/ossutil.zip" -d "$tmp_dir"
          sudo install -m 0755 "$tmp_dir/ossutil-v1.7.19-linux-amd64/ossutil" /usr/local/bin/ossutil

      - name: Persist review request before runner allocation
        env:
          OSS_AK: ${{ secrets.OSS_AK }}
          OSS_SK: ${{ secrets.OSS_SK }}
          OSS_ENDPOINT: oss-cn-hongkong.aliyuncs.com
          OSS_CODEX_REVIEW_PENDING_PREFIX: oss://doris-community-ci/codex/review-pending
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
          BASE_SHA: ${{ needs.resolve-pr.outputs.base_sha }}
          REVIEW_FOCUS: ${{ needs.resolve-pr.outputs.review_focus }}
        run: |
          request_file="$(mktemp "$RUNNER_TEMP/codex-review-pending.XXXXXX")"
          trap 'rm -f "$request_file"' EXIT
          jq -n \
            --arg pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg base_sha "$BASE_SHA" \
            --arg review_focus "$REVIEW_FOCUS" \
            --arg request_id "$GITHUB_RUN_ID" \
            --arg lease_id "$GITHUB_RUN_ID" \
            --arg lease_expires_at "$(date -u -d '+3 hours' +%Y-%m-%dT%H:%M:%SZ)" \
            '{pr_number: $pr_number, head_sha: $head_sha, base_sha: $base_sha,
              review_focus: $review_focus, not_before: "", request_id: $request_id,
              lease_id: $lease_id, lease_expires_at: $lease_expires_at}' > "$request_file"
          ossutil -i "$OSS_AK" -k "$OSS_SK" -e "$OSS_ENDPOINT" cp -f \
            "$request_file" "$OSS_CODEX_REVIEW_PENDING_PREFIX/${PR_NUMBER}-${HEAD_SHA}-${GITHUB_RUN_ID}.json"

  mark-review-pending:
    needs:
      - resolve-pr
      - enqueue-review
    runs-on: ubuntu-latest
    if: >-
      always() && needs.resolve-pr.result == 'success' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      (
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    steps:
      - name: Mark Code Review status as pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
        run: |
          state='pending'
          description="Automated review is running for ${HEAD_SHA}."
          if [ "${{ needs.enqueue-review.result }}" != 'success' ]; then
            state='error'
            description="Automated review request could not be queued durably."
          fi
          gh api repos/${REPO}/statuses/${HEAD_SHA} \
            -X POST \
            -f state="$state" \
            -f context='code-review' \
            -f description="$description" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  refresh-required-check:
    needs:
      - resolve-pr
      - code-review
      - enqueue-review
      - mark-review-pending
    runs-on: ubuntu-latest
    if: ${{ always() && needs.resolve-pr.result == 'success' && needs.code-review.result == 'success' }}
    steps:
      - name: Sync Code Review check for current head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
        run: |
          gh api repos/${REPO}/statuses/${HEAD_SHA} \
            -X POST \
            -f state='success' \
            -f context='code-review' \
            -f description="Automated review completed for ${HEAD_SHA}." \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
