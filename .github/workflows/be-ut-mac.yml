name: BE UT (macOS)

on:
  pull_request:
  schedule:
    - cron: '0 4,10,16,22 * * *'    # schedule it periodically to share the cache

concurrency:
  group: ${{ github.ref }} (BE UT macOS)
  cancel-in-progress: true

jobs:
  run-ut:
    name: BE UT (macOS)
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Paths Filter
        if: ${{ github.event_name != 'schedule' }}
        uses: ./.github/actions/paths-filter
        id: filter
        with:
          filters: |
            be_changes:
              - '.github/workflows/be-ut-mac.yml'
              - 'be/**'
              - 'gensrc/proto/**'
              - 'gensrc/thrift/**'

      - name: Ccache ${{ github.ref }}
        if: ${{ github.event_name == 'schedule' || steps.filter.outputs.be_changes == 'true' }}
        uses: ./.github/actions/ccache-action
        with:
          key: BE-UT-macOS
          max-size: "5G"
          restore-keys: BE-UT-macOS-

      - name: Run UT ${{ github.ref }}
        if: ${{ github.event_name == 'schedule' || steps.filter.outputs.be_changes == 'true' }}
        run: |
          cellars=(
            'm4'
            'automake'
            'autoconf'
            'libtool'
            'pkg-config'
            'texinfo'
            'coreutils'
            'gnu-getopt'
            'python@3'
            'cmake'
            'ninja'
            'ccache'
            'bison'
            'byacc'
            'gettext'
            'wget'
            'pcre'
            'openjdk@11'
            'maven'
            'node'
            'llvm@20'
            'bash'
          )
          brew install "${cellars[@]}" || true

          pushd thirdparty
          curl -L https://github.com/apache/doris-thirdparty/releases/download/automation-3.0/doris-thirdparty-prebuilt-darwin-x86_64.tar.xz \
            -o doris-thirdparty-prebuilt-darwin-x86_64.tar.xz
          tar -xvf doris-thirdparty-prebuilt-darwin-x86_64.tar.xz
          popd

          # The branch-3.1 x86_64 archive predates libevent's OpenSSL library,
          # which is required by the current BE test link. Rebuild only this
          # dependency when the archived file is absent.
          if [[ ! -f thirdparty/installed/lib/libevent_openssl.a ]]; then
            homebrew_bash="$(brew --prefix bash)/bin"
            export PATH="${homebrew_bash}:${PATH}"
            bash ./thirdparty/build-thirdparty.sh -j "$(nproc)" libevent
          fi

          export JAVA_HOME="${JAVA_HOME_17_X64%\/}"

          LLVM_PREFIX="$(brew --prefix llvm@20)"
          export PATH="${LLVM_PREFIX}/bin:${PATH}"
          export DORIS_CLANG_HOME="${LLVM_PREFIX}"
          export CC="${LLVM_PREFIX}/bin/clang"
          export CXX="${LLVM_PREFIX}/bin/clang++"

          ./run-be-ut.sh --run -j "$(nproc)" --clean
