name: BE UT (macOS)

on:
  pull_request:
  schedule:
    - cron: '0 4,10,16,22 * * *'    # schedule it periodically to share the cache

concurrency:
  group: ${{ github.ref }} (BE UT macOS)
  cancel-in-progress: true

jobs:
  run-ut:
    name: BE UT (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Paths Filter
        if: ${{ github.event_name != 'schedule' }}
        uses: ./.github/actions/paths-filter
        id: filter
        with:
          filters: |
            be_changes:
              - '.github/workflows/be-ut-mac.yml'
              - 'be/**'
              - 'gensrc/proto/**'
              - 'gensrc/thrift/**'

      - name: Ccache ${{ github.ref }}
        if: ${{ github.event_name == 'schedule' || steps.filter.outputs.be_changes == 'true' }}
        uses: ./.github/actions/ccache-action
        with:
          key: BE-UT-macOS
          # Leave enough space for the arm64 thirdparty bundle and ASAN build tree.
          max-size: "2G"
          restore-keys: BE-UT-macOS-

      - name: Run UT ${{ github.ref }}
        if: ${{ github.event_name == 'schedule' || steps.filter.outputs.be_changes == 'true' }}
        run: |
          cellars=(
            'm4'
            'automake'
            'autoconf'
            'libtool'
            'pkg-config'
            'texinfo'
            'coreutils'
            'gnu-getopt'
            'python@3'
            'cmake'
            'ninja'
            'ccache'
            'bison'
            'byacc'
            'gettext'
            'wget'
            'pcre'
            'openjdk@11'
            'maven'
            'node'
            'llvm@20'
            'libomp'
          )
          brew install "${cellars[@]}" || true

          pushd thirdparty
          branch="${{ github.base_ref }}"
          if [[ -z "${branch}" ]] || [[ "${branch}" == 'master' ]]; then
            curl -fL https://github.com/apache/doris-thirdparty/releases/download/automation/doris-thirdparty-prebuilt-darwin-arm64.tar.xz \
              -o doris-thirdparty-prebuilt-darwin-arm64.tar.xz
          else
            curl -fL "https://github.com/apache/doris-thirdparty/releases/download/automation-${branch/branch-/}/doris-thirdparty-prebuilt-darwin-arm64.tar.xz" \
              -o doris-thirdparty-prebuilt-darwin-arm64.tar.xz
          fi
          tar -xvf doris-thirdparty-prebuilt-darwin-arm64.tar.xz
          rm -f doris-thirdparty-prebuilt-darwin-arm64.tar.xz
          popd

          JAVA_HOME="${JAVA_HOME_17_arm64:-${JAVA_HOME_17_X64}}"
          export JAVA_HOME="${JAVA_HOME%\/}"

          LLVM_PREFIX="$(brew --prefix llvm@20)"
          export PATH="${LLVM_PREFIX}/bin:${PATH}"
          export DORIS_CLANG_HOME="${LLVM_PREFIX}"
          export CC="${LLVM_PREFIX}/bin/clang"
          export CXX="${LLVM_PREFIX}/bin/clang++"

          LIBOMP_PREFIX="$(brew --prefix libomp)"
          export CPPFLAGS="-I${LIBOMP_PREFIX}/include ${CPPFLAGS:-}"
          export CFLAGS="-I${LIBOMP_PREFIX}/include ${CFLAGS:-}"
          export CXXFLAGS="-I${LIBOMP_PREFIX}/include ${CXXFLAGS:-}"
          export LDFLAGS="-L${LIBOMP_PREFIX}/lib ${LDFLAGS:-}"
          export EXTRA_CXX_FLAGS="-I${LIBOMP_PREFIX}/include ${EXTRA_CXX_FLAGS:-}"

          ./run-be-ut.sh --run -j "$(nproc)" --clean
