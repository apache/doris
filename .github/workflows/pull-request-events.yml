name: Pull Request Events

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]

permissions: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This workflow can come from a fork. It has no checkout, secrets or writes.
      - name: Record PR event hints
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          data = {
              'number': event['number'],
              'action': event['action'],
              'head_sha': event['pull_request']['head']['sha'],
              'before': event.get('before', ''),
          }
          Path(os.environ['RUNNER_TEMP'], 'pr-event.json').write_text(json.dumps(data))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pull-request-event
          path: ${{ runner.temp }}/pr-event.json
          if-no-files-found: error
          retention-days: 7
