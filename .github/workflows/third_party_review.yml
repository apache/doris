---
name: Dependency License Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # Dependency manifests scanned by dependency-review-action.
      - 'thirdparty/**'
      - 'env.sh'
      - 'build.sh'
      - '**/pom.xml'
      - '**/go.mod'
      - '**/go.sum'
      - '**/Gemfile'
      - '**/Gemfile.lock'
      - '**/requirements*.txt'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/yarn.lock'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/poetry.lock'
      - '**/Pipfile'
      - '**/Pipfile.lock'
      - '**/build.gradle'
      - '**/composer.json'
      - '**/composer.lock'
      - '**/setup.py'
      - '.github/workflows/third_party_review.yml'
permissions:
  contents: read
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v5
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Possible values: "critical", "high", "moderate", "low"
          fail-on-severity: moderate
          # You can only include one of these two options: `allow-licenses` and `deny-licenses`
          # ([String]). Only allow these licenses (optional)
          # Possible values: Any SPDX-compliant license identifiers or expressions from https://spdx.org/licenses/
          # Project-approved licenses, including permissive Category A licenses from the ASF policy.
          allow-licenses: >-
            BSD-2-Clause, BSD-3-Clause, BSD-2-Clause-Views, MIT, MIT-0, ISC,
            Apache-2.0, EPL-2.0, MPL-2.0, CC0-1.0, Python-2.0, BlueOak-1.0.0
          # ([String]). Packages excluded from the license check, in purl format (optional).
          # The action matches a purl on type and name only - it ignores the version - so an entry
          # here allows every version of that package.
          #
          # caniuse-lite is browser-compatibility data used only by the UI build toolchain.
          # Keep this exception package-specific because CC-BY-4.0 is not generally allow-listed.
          #
          # Both JUnit coordinates are test-scope dependencies that no release artifact ships;
          # fail-on-scopes below covers `development`, which is why they reach this check at all.
          # org.junit.jupiter:junit-jupiter is EPL-2.0, a licence allow-licenses above already
          # carries, but GitHub's dependency graph reports it as LicenseRef-bad-non-standard, so
          # every pull request that adds a module with a JUnit 5 test fails on a licence the
          # project has already approved. junit:junit is EPL-1.0, an ASF Category B licence. No
          # pom declares it any more - the fe reactor runs no JUnit 4 test and carries no vintage
          # engine - but it still arrives transitively via guava-testlib (fe-core, test) and
          # hive-exec -> zookeeper -> jline (hive-udf, provided), and the standalone samples/
          # projects declare it directly, so the exception stays.
          allow-dependencies-licenses: >-
            pkg:npm/caniuse-lite@1.0.30001809,
            pkg:maven/org.junit.jupiter/junit-jupiter,
            pkg:maven/junit/junit
          # ([String]). Acknowledged advisories that must not fail the review (optional)
          # org.codehaus.jackson:jackson-mapper-asl (GHSA-c27h-mcmw-48hv, GHSA-r6j9-8759-g62w):
          # legacy Jackson 1.x is EOL and neither advisory has a fixed version. Hive's metastore
          # JSONMessageDeserializer, which the HMS notification-event path builds on, runs on it, so
          # these classes already ship inside the prebuilt org.apache.doris:hive-catalog-shade jar;
          # shading them in-repo only makes the dependency visible to this scan.
          allow-ghsas: GHSA-c27h-mcmw-48hv, GHSA-r6j9-8759-g62w
          # ([String]). Block pull requests that introduce vulnerabilities in the scopes that match this list (optional)
          # Possible values: "development", "runtime", "unknown"
          fail-on-scopes: development, runtime
