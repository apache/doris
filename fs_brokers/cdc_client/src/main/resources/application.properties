spring.web.resources.add-mappings=false

server.port=9096

backend.http.port=8040

# see doris-meta/image/VERSION
cluster.token=cluster-token

spring.mvc.async.request-timeout=300000

# Max scheduled CDC tasks per phase, shared by FROM TO and job-driven TVF.
# Override via be.conf cdc_client_java_opts=-Dpipeline.max-concurrent-tasks=N
# pipeline.max-concurrent-tasks=10

# Sink buffer soft limit as a fraction of Xmx (default 1/3), read from JVM system properties.
# Override via be.conf cdc_client_java_opts=-Dcdc.sink.memory.ratio=N
# cdc.sink.memory.ratio=0.3333333333333333

# Shared reader quota as a fraction of Xmx (default 1/3), read from JVM system properties.
# Override via be.conf cdc_client_java_opts=-Dcdc.reader.memory.ratio=N
# cdc.reader.memory.ratio=0.3333333333333333
