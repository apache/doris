    - "NOTICE"
    - "NOTICE.txt"
    - "doap_Doris.rdf"
    - ".clang-format"
    - ".clang-format-ignore"
    - ".clang-tidy"
    - ".gitattributes"
    - ".gitignore"
    - ".gitmodules"
    - ".gitleaks.toml"
    - ".licenserc.yaml"
    - ".rat-excludes"
    - ".github/**"
    - ".dockerignore"
    - "be/src/common/status.cpp"
    - "be/src/common/status.h"
    - "be/src/env/env.h"
    - "be/src/env/env_posix.cpp"
    - "**/clucene/**"
    - "**/apache-orc/**"
    - "**/glibc-compatibility/**"
    - "**/gutil/**"
    - "**/go.sum"
    - "**/test_data/**"
    - "**/jmockit/**"
    - "**/*.json"
    - "**/*.csv"
    - "**/*.dat"
    - "**/*.svg"
    - "**/*.md5"
    - "**/*.patch"
    - "**/*.log"
    - "**/*.sql"
    - "**/*.lock"
    - "**/*.out"
    - "**/*.ldif"
    - "**/*.parquet"
    - "docs/.markdownlintignore"
    - "fe/fe-core/src/test/resources/data/net_snmp_normal"
    - "fe/fe-core/src/test/resources/stageUtilTest.txt"
    # Recorded method-surface baseline; ConnectorMetadataSurfaceTest reads every
    # non-blank line as a method signature, so a header would break the test.
    - "fe/fe-connector/fe-connector-spi/src/test/resources/connector-metadata-methods.txt"
    # Recorded plugin API surface baselines, one per plugin family. Same reason as
    # above: each *PluginSurfaceTest.readBaseline() adds every non-blank line to the
    # expected signature set, so a header would be read back as phantom signatures.
    - "fe/fe-connector/fe-connector-spi/src/test/resources/connector-plugin-surface.txt"
    - "fe/fe-filesystem/fe-filesystem-spi/src/test/resources/filesystem-plugin-surface.txt"
    - "fe/fe-authentication/fe-authentication-spi/src/test/resources/authentication-plugin-surface.txt"
    - "fe/fe-core/src/test/resources/lineage-plugin-surface.txt"
    # Connector plugin settings templates. build.sh seeds each connector's live
    # <name>.conf from its template verbatim (cp -n), so the template's content IS
    # the file an administrator edits in plugins/connector/<dir>/. Matched by name
    # rather than by a **/*.conf.template glob, so a new one is a deliberate entry
    # here rather than something a wildcard silently absorbs.
    - "fe/fe-connector/fe-connector-adbc/src/main/resources/adbc.conf.template"
    - "fe/fe-connector/fe-connector-hive/src/main/resources/hms.conf.template"
    - "fe/fe-connector/fe-connector-iceberg/src/main/resources/iceberg.conf.template"
    - "fe/fe-connector/fe-connector-jdbc/src/main/resources/jdbc.conf.template"
    - "fe/fe-connector/fe-connector-paimon/src/main/resources/paimon.conf.template"
    - "fe/fe-connector/fe-connector-trino/src/main/resources/trino-connector.conf.template"
    # Golden 4.1.3 upgrade fixtures, emitted by Gen413Fixtures running real 4.1.3
    # bytecode (see the sibling PROVENANCE.txt) and stamped "do not edit by hand".
    # These are the generator's only non-binary outputs -- its .bin files are skipped
    # as binary and its .json files by the **/*.json rule above -- so listing them
    # here covers everything it writes. Deliberately NOT ignoring the directory:
    # upgrade/413/generator/Gen413Fixtures.java is real source and must stay checked.
    - "fe/fe-core/src/test/resources/upgrade/413/PROVENANCE.txt"
    - "fe/fe-core/src/test/resources/upgrade/413/editlog.index"
    - "fe/fe-core/src/test/resources/upgrade/413/labels.db.txt"
    - "fe/fe-core/src/test/resources/upgrade/413/labels.ds.txt"
    - "fe/fe-core/src/test/resources/upgrade/413/labels.tbl.txt"
    - "fe/fe-core/src/main/java/software/amazon/awssdk/core/client/builder/SdkDefaultClientBuilder.java"
    - "fe/fe-core/src/main/antlr4/org/apache/doris/nereids/JavaLexer.g4"
    - "fe/fe-core/src/main/antlr4/org/apache/doris/nereids/JavaParser.g4"
    - "fe/.idea/vcs.xml"
    - "be/dict/ik/*"
    - "be/dict/pinyin/*"
    - "be/dict/icu/**"
    - "be/src/common/signal_handler.h"
    - "be/src/olap/lru_cache.cpp"
    - "be/src/olap/lru_cache.h"
    - "be/src/olap/skiplist.h"
    - "be/src/runtime/string_search.hpp"
