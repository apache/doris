github:
  description: Apache Doris is a real-time analytics and hybrid search database for AI agents.
  homepage: https://doris.apache.org
  labels:
    - real-time
    - query-engine
    - olap
    - lakehouse
    - ai
    - agent
    - observability
    - sql
    - snowflake
    - redshift
    - bigquery
    - iceberg
    - hudi
    - delta-lake
    - paimon
    - vector
    - search
    - database
  enabled_merge_buttons:
    squash:  true
    merge:   false
    rebase:  false
  # Clear legacy protections so obsolete required checks do not remain active.
  protected_branches: ~
  # CI and review rules retain the classic default administrator bypass.
  # Force-push and deletion protection have no bypass, including for admins.
  # RepositoryRole 5 is the repository administrator role.
  rulesets:
    - name: "Doris branch safety"
      target: branch
      enforcement: active
      bypass_actors: []
      conditions:
        ref_name:
          include:
            - "refs/heads/master"
            - "refs/heads/branch-4.2"
            - "refs/heads/branch-4.1"
            - "refs/heads/branch-4.0"
            - "refs/heads/branch-3.1"
            - "refs/heads/branch-3.0"
            - "refs/heads/branch-2.1"
            - "refs/heads/branch-2.0"
          exclude: []
      rules:
        - type: deletion
        - type: non_fast_forward
    - name: "Doris master"
      target: branch
      enforcement: active
      bypass_actors:
        - actor_id: 5
          actor_type: RepositoryRole
          bypass_mode: always
      conditions:
        ref_name:
          include:
            - "refs/heads/master"
          exclude: []
      rules:
        - type: pull_request
          parameters:
            dismiss_stale_reviews_on_push: true
            require_code_owner_review: true
            require_last_push_approval: false
            required_approving_review_count: 1
            required_review_thread_resolution: false
        - type: required_status_checks
          parameters:
            strict_required_status_checks_policy: false
            required_status_checks:
              - context: "License Check"
              - context: "Check for secrets"
              - context: "Clang Formatter"
              - context: "CheckStyle"
              - context: "TeamCity/p0"
              - context: "TeamCity/nonconcurrent"
              - context: "TeamCity/external"
              - context: "TeamCity/cloud_p0"
              - context: "TeamCity/vault_p0"
              - context: "TeamCity/feut"
              - context: "TeamCity/beut"
              - context: "Build Third Party Libraries (Linux)"
              - context: "Build Third Party Libraries (macOS)"
              - context: "Build Third Party Libraries (macOS-arm64)"
              - context: "TeamCity/compile"
              - context: "code-review"
              - context: "TeamCity/cloudut"
